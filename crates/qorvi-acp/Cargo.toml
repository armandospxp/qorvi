[package]
name = "qorvi-acp"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
agent-client-protocol = "5.3.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "sync", "time", "macros", "fs"] }
tokio-util = { version = "0.7.20", features = ["compat"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "io-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
